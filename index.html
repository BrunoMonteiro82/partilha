<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferência Telemóvel -> PC</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f7f6; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .bloco { margin-bottom: 20px; padding: 15px; border-radius: 6px; }
        .telemovel { background: #e3f2fd; border-left: 5px solid #2196f3; }
        .pc { background: #efebe9; border-left: 5px solid #795548; }
        textarea { width: 100%; height: 100px; margin-top: 10px; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        button { width: 100%; padding: 12px; background: #2196f3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #recebidos { background: #f5f5f5; padding: 15px; min-height: 80px; white-space: pre-wrap; border-radius: 4px; border: 1px dashed #795548; margin-top: 10px; font-size: 15px; }
        .status { font-weight: bold; font-size: 14px; margin-bottom: 10px; color: #2196f3; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Painel de Transferência (Via Nuvem)</h2>
        <div class="status" id="status">🟢 Pronto (Ligação por HTTPS Segura)</div>

        <!-- TELEMÓVEL -->
        <div class="bloco telemovel">
            <strong>📱 SE ESTIVER NO TELEMÓVEL:</strong><br>
            <textarea id="texto-enviar" placeholder="Cole o link ou texto aqui..."></textarea>
            <button id="btn-enviar" onclick="enviarDados()">Enviar para o PC</button>
        </div>

        <!-- PC -->
        <div class="bloco pc">
            <strong>💻 SE ESTIVER NO PC:</strong><br>
            <span style="font-size: 13px; color: #555;">Verifica automaticamente a cada 3 segundos:</span>
            <div id="recebidos">A aguardar dados do telemóvel...</div>
        </div>
    </div>

    <script>
        const urlAPI = 'https://jsonbin.io';
        const apiKey = '$2a$10$R9oY8lXQ2m4/w.qD8vHKe.M7wZ9gY3z8Nl6g3r8n9V9x9e9f9g9h9';

        async function enviarDados() {
            const texto = document.getElementById('texto-enviar').value;
            if (!texto.trim()) return;
            document.getElementById('status').innerText = "⏳ A enviar...";
            try {
                const response = await fetch(urlAPI, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey },
                    body: JSON.stringify({ conteudo: texto })
                });
                if (response.ok) {
                    document.getElementById('texto-enviar').value = '';
                    document.getElementById('status').innerText = "🟢 Pronto (Ligação por HTTPS Segura)";
                    alert('Enviado com sucesso para a nuvem!');
                }
            } catch (error) { alert('Erro ao enviar.'); }
        }

        async function receberDados() {
            try {
                const response = await fetch(urlAPI + '/latest', { headers: { 'X-Master-Key': apiKey } });
                const dados = await response.json();
                if (dados.record && dados.record.conteudo) {
                    const painelRecebidos = document.getElementById('recebidos');
                    if (painelRecebidos.innerText !== dados.record.conteudo) {
                        painelRecebidos.innerText = dados.record.conteudo;
                        painelRecebidos.style.background = "#fff9c4";
                        setTimeout(() => painelRecebidos.style.background = "#f5f5f5", 1000);
                    }
                }
            } catch (error) {}
        }
        setInterval(receberDados, 3000);
        receberDados();
    </script>
</body>
</html>
